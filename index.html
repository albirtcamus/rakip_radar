<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rakip Radar">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rakip Radar</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --text:#eef0f4; --mute:#8a8f98;
          --toxic:#e5383b; --iyi:#f4a100; --kolay:#2bb673; --normal:#8a8f98; --yeni:#3a7bd5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; }
  body { padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); min-height:100vh; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#14171c; border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom); z-index:20; }
  nav button { flex:1; background:none; border:0; color:var(--mute); padding:10px 0 12px; font-size:12px; }
  nav button b { display:block; font-size:20px; margin-bottom:2px; }
  nav button.on { color:var(--text); }
  section { display:none; padding:12px; }
  section.on { display:block; }
  h2 { margin:4px 0 12px; font-size:20px; }
  .btn { display:inline-block; border:0; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:600;
         background:var(--card); color:var(--text); border:1px solid var(--line); }
  .btn.primary { background:var(--yeni); border-color:var(--yeni); }
  .btn.small { padding:8px 12px; font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], textarea, input[type=search] { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line);
         border-radius:10px; padding:12px; font-size:17px; font-family:inherit; }
  textarea { min-height:70px; }
  .mute { color:var(--mute); font-size:13px; }

  /* Tarama */
  #camWrap { position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; touch-action:none; }
  #video { display:block; width:100%; height:auto; }
  #roi { position:absolute; border:2px dashed #ffd400; box-shadow:0 0 0 9999px rgba(0,0,0,.35); pointer-events:none; display:none; }
  #camHint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--mute); }
  #status { margin:12px 0; padding:16px; border-radius:14px; background:var(--card); border:2px solid var(--line); min-height:96px; }
  #status .nick { font-size:26px; font-weight:800; word-break:break-all; }
  #status .tag { font-size:18px; font-weight:700; margin-top:4px; }
  #status .note { margin-top:6px; color:#d6d9df; }
  #status.toxic { border-color:var(--toxic); background:#3a1214; }
  #status.iyi { border-color:var(--iyi); background:#3a2a08; }
  #status.kolay { border-color:var(--kolay); background:#0d2c1f; }
  #status.normal { border-color:var(--normal); }
  #status.yeni { border-color:var(--yeni); background:#10213a; }
  #raw { white-space:pre-wrap; font-size:11px; color:var(--mute); background:#0a0b0e; padding:8px; border-radius:8px; max-height:160px; overflow:auto; display:none; }

  /* Tam ekran uyarı */
  #flash { position:fixed; inset:0; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center;
           text-align:center; padding:24px; font-weight:800; }
  #flash .big { font-size:44px; line-height:1.1; }
  #flash .nick { font-size:28px; margin-top:16px; word-break:break-all; }
  #flash .note { font-size:18px; font-weight:500; margin-top:12px; opacity:.9; }
  #flash .hint { position:absolute; bottom:calc(30px + env(safe-area-inset-bottom)); font-size:14px; font-weight:500; opacity:.7; }
  #flash.toxic { background:var(--toxic); animation:pulse .6s ease-in-out 4; }
  #flash.iyi { background:var(--iyi); color:#1b1300; }
  #flash.kolay { background:var(--kolay); }
  #flash.normal { background:#3b3f47; }
  #flash.yeni { background:var(--yeni); }
  @keyframes pulse { 50% { filter:brightness(1.6); } }

  /* Etiket butonları */
  .tags { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .tags button { border:2px solid transparent; border-radius:14px; padding:20px 8px; font-size:18px; font-weight:800; color:#fff; }
  .tags button[data-tag=toxic] { background:var(--toxic); }
  .tags button[data-tag=iyi] { background:var(--iyi); color:#1b1300; }
  .tags button[data-tag=kolay] { background:var(--kolay); }
  .tags button[data-tag=normal] { background:#3b3f47; }
  .tags button.sel { border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.35); transform:scale(1.02); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chip { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:6px 12px; font-size:14px; }
  .chip.on { background:var(--text); color:var(--bg); }

  /* Liste */
  .item { display:flex; gap:10px; align-items:flex-start; padding:12px; border-bottom:1px solid var(--line); }
  .dot { width:14px; height:14px; border-radius:50%; margin-top:5px; flex:none; }
  .item .main { flex:1; min-width:0; }
  .item .n { font-weight:700; font-size:17px; word-break:break-all; }
  .item .del { background:none; border:0; color:var(--mute); font-size:20px; padding:0 4px; }
  label.sw { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  #toast { position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#fff; color:#000;
           padding:10px 16px; border-radius:999px; font-weight:600; display:none; z-index:60; }
</style>
</head>
<body>

<!-- TARAMA -->
<section id="v-scan" class="on">
  <div id="camWrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="roi"></div>
    <div id="camHint">Telefonu ekrana doğru yerleştir ve <b>&nbsp;Başlat&nbsp;</b>'a dokun.</div>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" id="startBtn">▶ Başlat</button>
    <button class="btn small" id="roiBtn">⬚ Bölge seç</button>
    <button class="btn small" id="roiClear">Tüm ekran</button>
  </div>
  <div id="status"><div class="mute">Henüz rakip okunmadı.</div></div>
  <div class="row">
    <button class="btn small" id="fixBtn">✏️ İsmi düzelt</button>
    <button class="btn small" id="rateNowBtn">🏁 Maç bitti, etiketle</button>
  </div>
  <p class="mute" id="perf"></p>
  <div id="raw"></div>
</section>

<!-- MAÇ SONU -->
<section id="v-rate">
  <h2>Maç sonu</h2>
  <div class="mute">Rakip</div>
  <input type="text" id="rateNick" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="rakibin nicki">
  <div id="rateInfo" class="mute" style="margin-top:6px"></div>
  <div class="tags">
    <button data-tag="toxic">🔴 Toxic</button>
    <button data-tag="iyi">🟡 Çok iyi</button>
    <button data-tag="kolay">🟢 Kolay</button>
    <button data-tag="normal">⚪ Normal</button>
  </div>
  <textarea id="rateNote" placeholder="Not (isteğe bağlı): ör. sürekli pas yapıp oyalıyor"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" id="saveBtn" style="flex:1">💾 Kaydet</button>
  </div>
  <p class="mute" style="margin-top:18px">Son okunan rakipler</p>
  <div class="chips" id="recent"></div>
</section>

<!-- LİSTE -->
<section id="v-list">
  <h2>Rakip listesi <span class="mute" id="count"></span></h2>
  <input type="search" id="q" placeholder="Ara…" autocapitalize="off" spellcheck="false">
  <div class="chips" id="filters">
    <button class="chip on" data-f="">Hepsi</button>
    <button class="chip" data-f="toxic">🔴 Toxic</button>
    <button class="chip" data-f="iyi">🟡 Çok iyi</button>
    <button class="chip" data-f="kolay">🟢 Kolay</button>
    <button class="chip" data-f="normal">⚪ Normal</button>
  </div>
  <div id="list"></div>
</section>

<!-- AYARLAR -->
<section id="v-set">
  <h2>Ayarlar</h2>
  <div class="mute">Kendi PSN adın (rakip sanılmasın diye)</div>
  <input type="text" id="ownNick" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="sw">Renkleri ters çevir (koyu ekran için önerilir) <input type="checkbox" id="invert"></label>
  <label class="sw">Ses uyarısı <input type="checkbox" id="sound"></label>
  <label class="sw">Okunan ham metni göster (ayar/test için) <input type="checkbox" id="debug"></label>
  <h2 style="margin-top:22px">Yedek</h2>
  <p class="mute">Liste sadece bu telefonda saklanır. Arada bir yedek al.</p>
  <div class="row">
    <button class="btn" id="exportBtn">⬆️ Yedek al</button>
    <button class="btn" id="importBtn">⬇️ Yedekten yükle</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </div>
  <p class="mute" style="margin-top:24px">Rakip Radar · sürüm <span id="ver"></span></p>
</section>

<div id="flash"><div class="big"></div><div class="nick"></div><div class="note"></div><div class="hint">Kapatmak için dokun</div></div>
<div id="toast"></div>

<nav>
  <button data-v="scan" class="on"><b>📷</b>Tara</button>
  <button data-v="rate"><b>🏁</b>Maç sonu</button>
  <button data-v="list"><b>📋</b>Liste</button>
  <button data-v="set"><b>⚙️</b>Ayarlar</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="core.js"></script>
<script>
'use strict';
const VERSION = '1.0';
const $ = s => document.querySelector(s);
const TAGS = {
  toxic:  { label: 'TOXIC',          big: '🔴 TOXIC!<br>GİRME',        color: 'var(--toxic)' },
  iyi:    { label: 'Çok iyi oyuncu', big: '🟡 ÇOK İYİ OYUNCU',         color: 'var(--iyi)' },
  kolay:  { label: 'Kolay rakip',    big: '🟢 KOLAY RAKİP',            color: 'var(--kolay)' },
  normal: { label: 'Normal',         big: '⚪ NORMAL',                 color: 'var(--normal)' },
};
$('#ver').textContent = VERSION;

/* ---------- Kayıt (telefon hafızası) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Kaydedilemedi!'); } },
};
let db = store.get('rr_db', {});            // key -> kayıt
let settings = Object.assign({ own: 'Albirtcamus', invert: true, sound: true, debug: false, roi: null }, store.get('rr_settings', {}));
let current = store.get('rr_current', null); // son rakip {nick, key, time}
let recent = store.get('rr_recent', []);     // son 15 rakip
const saveDb = () => store.set('rr_db', db);
const saveSettings = () => store.set('rr_settings', settings);
const dbArr = () => Object.values(db);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 1800); }
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtDate(t) { return t ? new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }) : ''; }

/* ---------- Sekmeler ---------- */
let view = 'scan';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));
function show(v) {
  view = v;
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'list') renderList();
  if (v === 'rate') openRate();
  window.scrollTo(0, 0);
}

/* ---------- Ses ---------- */
let actx = null;
function beep(pattern) {
  if (!settings.sound || !actx) return;
  let t = actx.currentTime;
  for (const [freq, dur] of pattern) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'square';
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    t += dur + 0.08;
  }
}
const SOUNDS = { toxic: [[1200, .18], [1200, .18], [1200, .18], [900, .4]], iyi: [[800, .15], [1000, .2]], kolay: [[600, .25]], normal: [[500, .12]], yeni: [[700, .1]] };
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

/* ---------- Kamera ---------- */
const video = $('#video');
let stream = null, scanning = false, worker = null, wakeLock = null;

$('#startBtn').onclick = async () => {
  if (scanning) return stopScan();
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
  await startScan();
};

async function startScan() {
  $('#startBtn').disabled = true;
  try {
    if (!stream) {
      $('#camHint').textContent = 'Kamera açılıyor…';
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      video.srcObject = stream;
      await video.play();
    }
    $('#camHint').style.display = 'none';
    if (!worker) {
      if (typeof Tesseract === 'undefined') throw new Error('Yazı tanıma kütüphanesi yüklenemedi. İnternet bağlantını kontrol edip uygulamayı yeniden aç');
      $('#perf').textContent = 'Yazı tanıma yükleniyor… (ilk açılışta birkaç saniye sürebilir)';
      worker = await Tesseract.createWorker('eng', 1, {
        logger: m => { if (m.status && m.progress < 1) $('#perf').textContent = 'Yükleniyor: ' + m.status + ' ' + Math.round(m.progress * 100) + '%'; }
      });
      await worker.setParameters({ tessedit_pageseg_mode: '11' });
    }
    scanning = true;
    $('#startBtn').textContent = '⏸ Durdur';
    drawRoi();
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    loop();
  } catch (e) {
    $('#camHint').style.display = 'flex';
    const msg = String(e.message || e);
    $('#camHint').textContent = /yazı tanıma/i.test(msg) ? msg + '.' : 'Kamera açılamadı: ' + msg + '. Ayarlar > Safari > Kamera iznini kontrol et.';
  }
  $('#startBtn').disabled = false;
}

function stopScan() {
  scanning = false;
  $('#startBtn').textContent = '▶ Başlat';
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && scanning && 'wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
});

const sleep = ms => new Promise(r => setTimeout(r, ms));
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });

// Kameradan bir kare al, seçili bölgeyi kes, gri + ters + kontrast uygula.
function grabFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if (settings.roi) { sx = settings.roi.x * vw; sy = settings.roi.y * vh; sw = settings.roi.w * vw; sh = settings.roi.h * vh; }
  let scale = 1280 / Math.max(sw, sh);
  scale = Math.min(scale, 3);
  const W = Math.round(sw * scale), H = Math.round(sh * scale);
  work.width = W; work.height = H;
  wctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const img = wctx.getImageData(0, 0, W, H), d = img.data;
  let min = 255, max = 0;
  const g = new Uint8ClampedArray(W * H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    let v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114);
    if (settings.invert) v = 255 - v;
    g[j] = v; if (v < min) min = v; if (v > max) max = v;
  }
  const range = Math.max(1, max - min);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const v = (g[j] - min) * 255 / range;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  wctx.putImageData(img, 0, 0);
  return work;
}

async function loop() {
  while (scanning) {
    if (document.hidden || view !== 'scan') { await sleep(400); continue; }
    const frame = grabFrame();
    if (!frame) { await sleep(200); continue; }
    const t0 = performance.now();
    try {
      const { data } = await worker.recognize(frame);
      handleText(data.text || '');
    } catch (e) { console.warn(e); }
    const ms = Math.round(performance.now() - t0);
    $('#perf').textContent = 'Okuma süresi: ' + ms + ' ms';
    await sleep(60);
  }
}

/* ---------- Okunan metni değerlendir ---------- */
const hist = [];  // son kareler: {known, opp}
function handleText(text) {
  if (settings.debug) { $('#raw').style.display = 'block'; $('#raw').textContent = text; } else $('#raw').style.display = 'none';
  const known = Core.findKnown(text, dbArr(), settings.own);
  const opp = Core.extractOpponent(text, settings.own);
  hist.push({ known: known && known.rec.key, opp: opp && Core.normKey(opp), oppRaw: opp });
  if (hist.length > 4) hist.shift();

  if (known) {
    const k = known.rec.key;
    const hits = hist.filter(h => h.known === k).length;
    if (known.score >= 0.92 || hits >= 2) return setOpponent(known.rec.nick, true);
  }
  if (opp) {
    const k = Core.normKey(opp);
    const hits = hist.filter(h => h.opp && Core.score(h.opp, k) >= 0.85).length;
    if (hits >= 2) {
      // Birden fazla okumada en uzun/temiz hali seç
      const best = hist.filter(h => h.opp && Core.score(h.opp, k) >= 0.85).map(h => h.oppRaw).sort((a, b) => b.length - a.length)[0];
      return setOpponent(best || opp, false);
    }
  }
}

function lookup(nick) {
  const k = Core.normKey(nick);
  if (db[k]) return db[k];
  let best = null;
  for (const r of dbArr()) { const s = Core.score(k, r.key); if (s >= Core.threshold(r.key.length) && (!best || s > best.s)) best = { r, s }; }
  return best ? best.r : null;
}

function setOpponent(nick, fromDb) {
  const rec = lookup(nick);
  const name = rec ? rec.nick : nick;
  const key = Core.normKey(name);
  const same = current && Core.score(current.key, key) >= 0.85 && (Date.now() - current.time) < 10 * 60 * 1000;
  current = { nick: name, key, time: Date.now() };
  store.set('rr_current', current);
  recent = [current, ...recent.filter(r => Core.score(r.key, key) < 0.85)].slice(0, 15);
  store.set('rr_recent', recent);
  renderStatus();
  if (same) return;          // aynı rakip, tekrar alarm verme
  const tag = rec ? rec.tag : 'yeni';
  showFlash(tag, name, rec);
  beep(SOUNDS[tag] || SOUNDS.yeni);
  vibrate(tag === 'toxic' ? [300, 100, 300, 100, 300] : [150]);
}

function renderStatus() {
  const box = $('#status');
  box.className = '';
  if (!current) { box.innerHTML = '<div class="mute">Henüz rakip okunmadı.</div>'; return; }
  const rec = lookup(current.nick);
  if (rec) {
    box.classList.add(rec.tag);
    box.innerHTML = `<div class="nick">${esc(rec.nick)}</div><div class="tag" style="color:${TAGS[rec.tag].color}">${TAGS[rec.tag].label}</div>` +
      (rec.note ? `<div class="note">📝 ${esc(rec.note)}</div>` : '') +
      `<div class="mute" style="margin-top:6px">${rec.count || 1} kez karşılaştınız · son: ${fmtDate(rec.last)}</div>`;
  } else {
    box.classList.add('yeni');
    box.innerHTML = `<div class="nick">${esc(current.nick)}</div><div class="tag" style="color:#8fb6ff">Yeni rakip — listede kayıt yok</div>`;
  }
}

function showFlash(tag, name, rec) {
  const f = $('#flash');
  f.className = tag;
  f.querySelector('.big').innerHTML = rec ? TAGS[tag].big : '🆕 YENİ RAKİP';
  f.querySelector('.nick').textContent = name;
  f.querySelector('.note').textContent = rec && rec.note ? '📝 ' + rec.note : (rec ? '' : 'Listede kaydı yok');
  f.style.display = 'flex';
  clearTimeout(showFlash.t);
  showFlash.t = setTimeout(() => f.style.display = 'none', tag === 'toxic' ? 8000 : 4000);
}
$('#flash').onclick = () => $('#flash').style.display = 'none';

$('#fixBtn').onclick = () => {
  const v = prompt('Rakibin doğru nicki:', current ? current.nick : '');
  if (v && v.trim()) { current = null; setOpponent(v.trim(), false); }
};
$('#rateNowBtn').onclick = () => show('rate');

/* ---------- Bölge seçimi (çerçeve) ---------- */
let roiMode = false, roiStart = null;
const wrap = $('#camWrap');
$('#roiBtn').onclick = () => { roiMode = true; toast('Parmağınla ismin olduğu alanı çiz'); };
$('#roiClear').onclick = () => { settings.roi = null; saveSettings(); drawRoi(); toast('Tüm ekran okunuyor'); };
function rel(e) { const r = wrap.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: Math.min(1, Math.max(0, (p.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (p.clientY - r.top) / r.height)) }; }
function roiFrom(a, b) { return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) }; }
let roiTmp = null;
wrap.addEventListener('touchstart', e => { if (!roiMode) return; e.preventDefault(); roiStart = rel(e); }, { passive: false });
wrap.addEventListener('touchmove', e => { if (!roiMode || !roiStart) return; e.preventDefault(); roiTmp = roiFrom(roiStart, rel(e)); drawRoi(roiTmp); }, { passive: false });
wrap.addEventListener('touchend', () => {
  if (!roiMode || !roiStart) return;
  if (roiTmp && roiTmp.w > 0.05 && roiTmp.h > 0.03) { settings.roi = roiTmp; saveSettings(); toast('Bölge kaydedildi'); }
  roiMode = false; roiStart = null; roiTmp = null; drawRoi();
});
function drawRoi(r) {
  r = r || settings.roi;
  const el = $('#roi');
  if (!r) { el.style.display = 'none'; return; }
  Object.assign(el.style, { display: 'block', left: r.x * 100 + '%', top: r.y * 100 + '%', width: r.w * 100 + '%', height: r.h * 100 + '%' });
}

/* ---------- Maç sonu / etiketleme ---------- */
let selTag = null;
document.querySelectorAll('.tags button').forEach(b => b.onclick = () => {
  selTag = b.dataset.tag;
  document.querySelectorAll('.tags button').forEach(x => x.classList.toggle('sel', x === b));
});
function openRate(nick) {
  const n = nick || (current && current.nick) || '';
  $('#rateNick').value = n;
  fillRate();
  $('#recent').innerHTML = recent.map(r => `<button class="chip" data-n="${esc(r.nick)}">${esc(r.nick)}</button>`).join('') || '<span class="mute">Yok</span>';
  $('#recent').querySelectorAll('button').forEach(b => b.onclick = () => { $('#rateNick').value = b.dataset.n; fillRate(); });
}
function fillRate() {
  const rec = lookup($('#rateNick').value.trim());
  selTag = rec ? rec.tag : null;
  document.querySelectorAll('.tags button').forEach(x => x.classList.toggle('sel', x.dataset.tag === selTag));
  $('#rateNote').value = rec ? (rec.note || '') : '';
  $('#rateInfo').textContent = rec ? `Kayıtlı: ${TAGS[rec.tag].label} · ${rec.count || 1} maç · son ${fmtDate(rec.last)}` : ($('#rateNick').value ? 'Listede yok, yeni kayıt olacak.' : '');
}
$('#rateNick').addEventListener('input', fillRate);
$('#saveBtn').onclick = () => {
  const nick = $('#rateNick').value.trim();
  if (!nick) return toast('Önce rakibin nickini yaz');
  if (!selTag) return toast('Bir etiket seç');
  const note = $('#rateNote').value.trim();
  const old = lookup(nick);
  const key = old ? old.key : Core.normKey(nick);
  const now = Date.now();
  const rec = old || { nick, key, first: now, count: 0, history: [] };
  if (old && old.nick !== nick && Core.normKey(nick) !== old.key) { /* benzer isim: eski kaydı kullan */ }
  rec.nick = old ? old.nick : nick;
  rec.tag = selTag; rec.note = note; rec.last = now; rec.count = (rec.count || 0) + 1;
  rec.history = [...(rec.history || []), { tag: selTag, note, date: now }].slice(-20);
  db[key] = rec; saveDb();
  toast('Kaydedildi: ' + rec.nick + ' → ' + TAGS[selTag].label);
  renderStatus();
  setTimeout(() => show('scan'), 700);
};

/* ---------- Liste ---------- */
let filter = '';
$('#q').addEventListener('input', renderList);
document.querySelectorAll('#filters .chip').forEach(c => c.onclick = () => {
  filter = c.dataset.f;
  document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('on', x === c));
  renderList();
});
function renderList() {
  const q = Core.normKey($('#q').value);
  const arr = dbArr().filter(r => (!filter || r.tag === filter) && (!q || r.key.includes(q))).sort((a, b) => (b.last || 0) - (a.last || 0));
  $('#count').textContent = '(' + dbArr().length + ')';
  $('#list').innerHTML = arr.map(r => `
    <div class="item" data-k="${esc(r.key)}">
      <div class="dot" style="background:${TAGS[r.tag].color}"></div>
      <div class="main"><div class="n">${esc(r.nick)}</div>
        <div class="mute">${TAGS[r.tag].label} · ${r.count || 1} maç · ${fmtDate(r.last)}</div>
        ${r.note ? `<div style="margin-top:4px">📝 ${esc(r.note)}</div>` : ''}</div>
      <button class="del" data-del="${esc(r.key)}">🗑</button>
    </div>`).join('') || '<p class="mute">Kayıt yok.</p>';
  $('#list').querySelectorAll('.item').forEach(el => el.onclick = e => {
    if (e.target.dataset.del) {
      const r = db[e.target.dataset.del];
      if (r && confirm(r.nick + ' silinsin mi?')) { delete db[r.key]; saveDb(); renderList(); }
      return;
    }
    const r = db[el.dataset.k]; if (r) { show('rate'); openRate(r.nick); }
  });
}

/* ---------- Ayarlar ---------- */
$('#ownNick').value = settings.own;
$('#invert').checked = settings.invert;
$('#sound').checked = settings.sound;
$('#debug').checked = settings.debug;
$('#ownNick').onchange = () => { settings.own = $('#ownNick').value.trim(); saveSettings(); toast('Kaydedildi'); };
$('#invert').onchange = () => { settings.invert = $('#invert').checked; saveSettings(); };
$('#sound').onchange = () => { settings.sound = $('#sound').checked; saveSettings(); };
$('#debug').onchange = () => { settings.debug = $('#debug').checked; saveSettings(); };

$('#exportBtn').onclick = async () => {
  const data = JSON.stringify({ app: 'rakip-radar', version: VERSION, date: new Date().toISOString(), db }, null, 1);
  const name = 'rakip-radar-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([data], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Rakip Radar yedeği' }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const inc = j.db || j; let n = 0;
    for (const k in inc) { const r = inc[k]; if (r && r.nick && r.tag) { r.key = Core.normKey(r.nick); if (!db[r.key] || (r.last || 0) > (db[r.key].last || 0)) { db[r.key] = r; n++; } } }
    saveDb(); toast(n + ' kayıt yüklendi'); renderList();
  } catch (err) { toast('Dosya okunamadı'); }
  e.target.value = '';
};

renderStatus();
drawRoi();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
